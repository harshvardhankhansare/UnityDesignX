<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnityDesignX</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
</head>
<body>
    <div class="container">
      <form action="Login_DB.php" method="post">
        <div class="box">
          <h1>Sign In</h1>
          <div class="user">
            <i class="fas fa-envelope"></i>
            <input type="text" name="uemail" id="email" placeholder="Email Address">
            <i class="fas fa-unlock-alt"></i>
            <input type="password" name="upassword" id="password" placeholder="Password">
          </div>
          <div class="login-btn">
            <button class="btn" name="login">Login</button>
            <p class="signup" style="margin-top: 20px;">Don't have an account ? <a href="signup.html"><span>Register</span> </a></p>
          </div>
        </div>
      </form>
        
      </div>
</body>
</html>
